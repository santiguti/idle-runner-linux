name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Install xvfb (the UI tests need a display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -q
      # Real input on a real window (tests/test_backend_desktop.py): the Win32 backend can only run here.
      - name: Desktop backend test (Windows)
        if: runner.os == 'Windows'
        run: pytest -q -m desktop
